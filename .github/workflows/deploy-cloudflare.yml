name: Deploy Cloudflare Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      UNIFIED_MCP_ADMIN_SECRET: ${{ secrets.UNIFIED_MCP_ADMIN_SECRET }}
      UNIFIED_MCP_GITHUB_TOKEN: ${{ secrets.UNIFIED_MCP_GITHUB_TOKEN }}
      UNIFIED_MCP_META_TOKEN: ${{ secrets.UNIFIED_MCP_META_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install core dependencies
        run: npm ci --ignore-scripts --no-fund --no-audit

      - name: Install Cloudflare deploy dependencies
        working-directory: cloudflare
        run: npm install --ignore-scripts --no-fund --no-audit

      - name: Verify required deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$UNIFIED_MCP_ADMIN_SECRET" || { echo "Missing UNIFIED_MCP_ADMIN_SECRET"; exit 1; }

      - name: Dry-run bundle
        working-directory: cloudflare
        run: npm run check

      - name: Build secret file
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          {
            printf 'UNIFIED_MCP_ADMIN_SECRET=%s\n' "$UNIFIED_MCP_ADMIN_SECRET"
            if [ -n "${UNIFIED_MCP_GITHUB_TOKEN:-}" ]; then
              printf 'UNIFIED_MCP_GITHUB_TOKEN=%s\n' "$UNIFIED_MCP_GITHUB_TOKEN"
            fi
            if [ -n "${UNIFIED_MCP_META_TOKEN:-}" ]; then
              printf 'UNIFIED_MCP_META_TOKEN=%s\n' "$UNIFIED_MCP_META_TOKEN"
            fi
          } > cloudflare/.deploy.secrets

      - name: Deploy Worker
        working-directory: cloudflare
        run: npx wrangler deploy --secrets-file .deploy.secrets

      - name: Remove temporary secret file
        if: always()
        run: rm -f cloudflare/.deploy.secrets
