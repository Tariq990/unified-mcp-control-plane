name: Unified MCP Gateway CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: unified-mcp-gateway-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, tests, audit
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --ignore-scripts --no-fund --no-audit

      - name: Build and test
        run: npm run check

      - name: Audit high-severity dependency vulnerabilities
        run: npm audit --audit-level=high
